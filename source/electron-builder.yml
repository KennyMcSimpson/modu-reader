appId: io.github.kennymcsimpson.inkglass
productName: Inkglass
electronVersion: 44.9.1
directories:
  app: dist/app
  output: ../release
  buildResources: desktop/assets
files:
  - desktop/**/*
  - dist/desktop/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
extraFiles:
  - from: ../LICENSE
    to: LICENSE-Inkglass.txt
  - from: ../QUICKSTART.txt
    to: QUICKSTART.txt
  - from: ../sample-document.md
    to: sample-document.md
  - from: dist/THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
win:
  executableName: Inkglass
  icon: desktop/assets/icon.ico
  target:
    - target: zip
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: Inkglass-${version}-Windows-${arch}.${ext}
nsis:
  artifactName: Inkglass-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Inkglass
  include: desktop/installer.nsh
  installerLanguages: [en_US]
  language: 1033
  displayLanguageSelector: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
publish: null
