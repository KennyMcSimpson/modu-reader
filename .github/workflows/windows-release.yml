name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Typecheck and file boundary tests
        run: |
          pnpm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
      - name: Build portable ZIP and installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run dist:win
      - name: Run the EXE extracted from the portable ZIP
        run: |
          $zip = Get-ChildItem ../release/*-Windows-x64.zip | Select-Object -First 1
          $portable = Join-Path $env:RUNNER_TEMP 'modu-portable'
          Expand-Archive $zip.FullName -DestinationPath $portable
          $env:MODU_EXECUTABLE = Join-Path $portable 'MoDu Reader.exe'
          pnpm run test:desktop
      - name: Verify installer, file registration and installed EXE
        run: |
          $setup = Get-ChildItem ../release/*-Setup-x64.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'modu-installed'
          $process = Start-Process $setup.FullName -ArgumentList '/S', "/D=$target" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $command = (Get-Item 'HKCU:\Software\Classes\MoDu.Reader.Markdown\shell\open\command').GetValue('')
          if (-not $command.Contains('MoDu Reader.exe') -or -not $command.Contains('"%1"')) { throw 'Open-with registration is missing' }
          $env:MODU_EXECUTABLE = Join-Path $target 'MoDu Reader.exe'
          pnpm run test:desktop
      - name: Create checksums
        run: |
          Get-ChildItem ../release/*.zip, ../release/*-Setup-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content ../release/SHA256SUMS.txt -Encoding utf8
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-evidence
          path: source/test-results/
          if-no-files-found: ignore
      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages
          compression-level: 0
          path: |
            release/*-Windows-x64.zip
            release/*-Setup-x64.exe
            release/SHA256SUMS.txt
      - name: Publish this version after all Windows checks pass
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "$tag already exists; leaving published files unchanged."; exit 0 }
          gh release create $tag ../release/*-Windows-x64.zip ../release/*-Setup-x64.exe ../release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "墨读 MoDu Reader $version · Windows" --notes-file ../docs/releases/v2.0.0.md
